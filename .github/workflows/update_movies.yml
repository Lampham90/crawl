name: 🤖 Auto Update Movies Data

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: 📥 Bước 1: Pull mã nguồn từ Repo về
        uses: actions/checkout@v4

      - name: 🐍 Bước 2: Khởi tạo môi trường Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Bước 3: Cài đặt thư viện cần thiết
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 🚀 Bước 4: Chạy Script cập nhật dữ liệu phim
        run: python update_data.py

      - name: 📊 Bước 5: Kiểm tra và Xuất báo cáo bằng Python
        id: check_changes
        run: |
          python -c '
          import os, subprocess
          
          # Lấy danh sách file thay đổi trong data_categories
          res = subprocess.run(["git", "diff", "--name-only", "data_categories/"], capture_output=True, text=True)
          files = [f.strip() for f in res.stdout.split("\n") if f.strip()]
          
          summary_file = os.environ.get("GITHUB_STEP_SUMMARY", "summary.md")
          output_file = os.environ.get("GITHUB_OUTPUT", "output.txt")
          
          with open(summary_file, "a", encoding="utf-8") as f:
              f.write("## 📊 BÁO CÁO CẬP NHẬT DỮ LIỆU PHIM\n")
              if not files:
                  f.write("✅ **Giữ nguyên:** Tất cả danh mục đều đã mới nhất, không tìm thấy phim mới nào từ API.\n")
                  has_changes = "false"
              else:
                  f.write("| Trạng thái | Tên File Danh Mục |\n")
                  f.write("| :--- | :--- |\n")
                  for file in files:
                      f.write(f"| 🔄 **Đã cập nhật (Có phim mới)** | `{file}` |\n")
                  has_changes = "true"
                  
          with open(output_file, "a", encoding="utf-8") as f:
              f.write(f"has_changes={has_changes}\n")
          '

      - name: 💾 Bước 6: Commit và Push dữ liệu mới lên GitHub
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          
          git add data_categories/
          git commit -m "🤖 [Bot] Tự động cập nhật phim mới cập nhật vào thư mục dữ liệu"
          git push
