name: Auto Update Movies Data

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-ok: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install requests
        run: pip install requests

      - name: Run script Python
        run: python update_data.py

      - name: Render Detail Report and Push
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          
          # 🌟 KIỂM TRA TRƯỚC: Nếu thư mục dữ liệu KHÔNG CÓ THAY ĐỔI so với repo git
          if [ -z "$(git status --porcelain data_categories/)" ]; then
              echo "## 📊 BÁO CÁO CHI TIẾT CẬP NHẬT PHIM" >> $GITHUB_STEP_SUMMARY
              echo "Thời gian quét hệ thống: $(date '+%Y-%m-%d %H:%M:%S') (UTC)" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "✅ **Giữ nguyên:** Tất cả danh mục đều đã mới nhất, không có phim mới nào so với commit trước." >> $GITHUB_STEP_SUMMARY
              echo "Không có sự thay đổi nào trong dữ liệu file."
          else
              # Nếu THỰC SỰ CÓ ĐỔI MỚI (ní vừa xóa phim hoặc API có phim mới) -> Mới in chi tiết
              echo "## 📊 BÁO CÁO CHI TIẾT CẬP NHẬT PHIM" >> $GITHUB_STEP_SUMMARY
              echo "Thời gian quét hệ thống: $(date '+%Y-%m-%d %H:%M:%S') (UTC)" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              
              python -c '
              import json, os
              summary_file = os.environ.get("GITHUB_STEP_SUMMARY", "summary.md")
              if os.path.exists("update_report.json"):
                  with open("update_report.json", "r", encoding="utf-8") as f:
                      logs = json.load(f)
                  with open(summary_file, "a", encoding="utf-8") as f:
                      if logs:
                          f.write("| Danh Mục | Tên Phim | Hành Động | Tập Mới Nhất |\n")
                          f.write("| :--- | :--- | :--- | :--- |\n")
                          for log in logs:
                              line = "| `" + log["cat"] + "` | **" + log["name"] + "** | " + log["type"] + " | `" + log["ep"] + "` |\n"
                              f.write(line)
              '
              
              # Tiến hành push dữ liệu thay đổi thực tế lên repo
              git add data_categories/
              git commit -m "🤖 [Bot] Cap nhat chi tiet cac tap phim moi"
              git push
          fi
