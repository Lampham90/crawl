name: Auto Update Movies Data

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install requests
        run: pip install requests

      - name: Run script Python
        run: python update_data.py

      - name: Create Report and Push
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          
          # Lưu trạng thái thay đổi trước khi add
          echo "## 📊 BÁO CÁO CẬP NHẬT DỮ LIỆU PHIM" >> $GITHUB_STEP_SUMMARY
          echo "Thời gian: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -z "$(git status --porcelain data_categories/)" ]; then
              echo "✅ **Giữ nguyên:** Không tìm thấy phim mới nào từ API." >> $GITHUB_STEP_SUMMARY
              echo "Không có dữ liệu mới."
          else
              echo "🔄 **Có danh mục được cập nhật phim mới!** Chi tiết thay đổi:" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              git status -s data_categories/ >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              
              # Tiến hành push lên repo
              git add data_categories/
              git commit -m "🤖 [Bot] Tu dong cap nhat phim moi"
              git push
          fi
