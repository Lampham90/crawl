name: 🤖 Auto Update Movies Data

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: 📥 Bước 1: Pull mã nguồn từ Repo về
        uses: actions/checkout@v4

      - name: 🐍 Bước 2: Khởi tạo môi trường Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Bước 3: Cài đặt thư viện cần thiết
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 🚀 Bước 4: Chạy Script cập nhật dữ liệu phim
        run: python update_data.py

      - name: 📊 Bước 5: Kiểm tra và Xuất báo cáo chi tiết
        id: check_changes
        run: |
          # Kiểm tra xem thư mục data_categories có gì thay đổi so với repo không
          git status --porcelain data_categories/ > changes.txt
          
          # Khởi tạo tiêu đề báo cáo lên trang Summary của GitHub
          echo "## 📊 BÁO CÁO CẬP NHẬT DỮ LIỆU PHIM" >> $GITHUB_STEP_SUMMARY
          echo "Thời gian chạy: $(date '+%Y-%m-%d %H:%M:%S') (UTC)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Nếu file changes.txt rỗng nghĩa là không có phim mới nào được nạp vào file JSON
          if [ ! -s changes.txt ]; then
            echo "✅ **Giữ nguyên:** Tất cả danh mục đều đã mới nhất, không tìm thấy phim mới nào từ API." >> $GITHUB_STEP_SUMMARY
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "| Trạng thái | Tên File Danh Mục |" >> $GITHUB_STEP_SUMMARY
            echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
            
            # Đọc nhanh danh sách file bị chỉnh sửa mà không dùng vòng lặp phức tạp
            git diff --name-only data_categories/ | while read -r line; do
              echo "| 🔄 **Đã cập nhật (Có phim mới)** | \`${line}\` |" >> $GITHUB_STEP_SUMMARY
            done
            
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
          
          # In kết quả kiểm tra ra màn hình log để debug nếu cần
          echo "=== Các file có sự thay đổi ==="
          cat changes.txt

      - name: 💾 Bước 6: Commit và Push dữ liệu mới lên GitHub
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          
          git add data_categories/
          git commit -m "🤖 [Bot] Tự động cập nhật phim mới cập nhật vào thư mục dữ liệu"
          git push
