name: 🤖 Auto Update Movies Data

on:
  schedule:
    # Chạy tự động mỗi 4 tiếng một lần (Thời gian UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Cho phép ní bấm nút "Run workflow" bằng tay trên web GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Bước 1: Pull mã nguồn từ Repo về
        uses: actions/checkout@v4

      - name: 🐍 Bước 2: Khởi tạo môi trường Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Bước 3: Cài đặt thư viện cần thiết
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 🚀 Bước 4: Chạy Script cập nhật dữ liệu phim
        run: python update_data.py

      - name: 💾 Bước 5: Commit và Push dữ liệu mới lên GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          
          # Chỉ add đúng thư mục chứa các file json danh mục con
          git add data_categories/
          
          # Kiểm tra nếu có sự thay đổi thì mới commit & push để tránh lỗi
          if git diff --staged --quiet; then
            echo "Ngon lành! Không có phim nào mới để cập nhật."
          else
            git commit -m "🤖 [Bot] Tự động cập nhật phim mới cập nhật vào thư mục dữ liệu"
            git push
          fi
