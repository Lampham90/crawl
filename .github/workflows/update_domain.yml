name: Auto Update Domain

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # Chạy tự động mỗi 6 tiếng

jobs:
  update:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm init -y
          npm install puppeteer

      - name: Run script
        run: node update-domain.js

      - name: Commit and push domain.txt
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add domain.txt
          git diff --quiet && git diff --cached --quiet || (git commit -m "Auto update domain.txt" && git push)
